<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - FL Mates</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Teko', sans-serif; }
        body { background-color: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .admin-container { width: 800px; background: #0b0b0b; border: 2px solid #FFD700; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .admin-header { background: #1a1a1a; padding: 15px 20px; font-size: 24px; color: #FFD700; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .close-btn { color: #fff; cursor: pointer; font-size: 20px; text-decoration: none; }
        .admin-body { display: flex; height: 400px; }
        .sidebar { width: 200px; background: #151515; padding: 10px 0; border-right: 1px solid #333; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 10px 20px; font-size: 18px; cursor: pointer; color: #aaa; transition: 0.3s; }
        .sidebar ul li:hover, .sidebar ul li.active { background: #FFD700; color: #000; font-weight: 600; }
        .content { padding: 20px; flex: 1; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #1a1a1a; padding: 15px; text-align: center; border-radius: 5px; border: 1px solid #333; }
        .stat-card span { font-size: 14px; color: #aaa; text-transform: uppercase; }
        .stat-card h3 { font-size: 32px; margin-top: 5px; color: #fff; }
        .quick-edit h2 { font-size: 20px; margin-bottom: 15px; color: #FFD700; }
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .edit-btn { background: transparent; color: #fff; border: 1px solid #555; padding: 10px; font-size: 16px; cursor: pointer; text-align: left; border-radius: 4px; transition: 0.3s; }
        .edit-btn:hover { border-color: #FFD700; color: #FFD700; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            ADMIN PANEL <a href="/" class="close-btn">✖</a>
        </div>
        <div class="admin-body">
            <div class="sidebar">
                <ul>
                    <li class="active">📊 Dashboard</li>
                    <li>🖼️ Hero Section</li>
                    <li>⚔️ Matches</li>
                    <li>👥 Teams</li>
                    <li>🏆 Tournaments</li>
                    <li>📰 News</li>
                </ul>
            </div>
            <div class="content">
                <div class="stats-grid">
                    <div class="stat-card"><span>Matches</span><h3>{{ data.matches }}</h3></div>
                    <div class="stat-card"><span>Teams</span><h3>{{ data.teams }}</h3></div>
                    <div class="stat-card"><span>Tournaments</span><h3>{{ data.tournaments }}</h3></div>
                    <div class="stat-card"><span>News</span><h3>{{ data.news }}</h3></div>
                </div>
                <div class="quick-edit">
                    <h2>QUICK EDIT</h2>
                    <div class="btn-grid">
                        <button class="edit-btn">✏️ EDIT HERO</button>
                        <button class="edit-btn">📅 MANAGE MATCHES</button>
                        <button class="edit-btn">👥 MANAGE TEAMS</button>
                        <button class="edit-btn">🏆 MANAGE TOURNAMENTS</button>
                        <button class="edit-btn">📰 MANAGE NEWS</button>
                        <button class="edit-btn">🔗 SOCIAL LINKS</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
